{% load static %}
<html>
    <head>
        <title>{% block title %}{% endblock title %}</title>
        <link href="{% static 'bootstrap.css' %}" rel="stylesheet">
        <link href="{% static 'customs.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div class="bg-primary text-white p-4 text-center">
                <img src="{% static 'logo.svg' %}" alt="Logo" class="Logo">
            </div>

            <nav class="navbar navbar-dark bg-primary px-3 mb-4">
                <a href="{% url 'pokedex:index' %}" class="navbar-brand fw-bold">
                    <i class="fa-solid fa-dragon"></i> Pokemons
                </a>

                <div class="d-flex align-items-center gap-2">
                    {% if user.is_authenticated %}
                        <span class="text-white small">
                            <i class="fa-solid fa-user"></i> {{ user.username }}
                        </span>
                        <form action="{% url 'logout' %}" method="post" class="mb-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-light btn-sm">
                                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesion
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-light btn-sm">
                            <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesion
                        </a>
                    {% endif %}
                </div>
            </nav>

            {% block content %}{% endblock content %}
        </div>
    </body>
</html>
