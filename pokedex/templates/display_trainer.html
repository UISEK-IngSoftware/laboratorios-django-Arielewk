{% extends "base.html" %}
{% block title %}{{ trainer | capfirst}}{% endblock title %}
{% block content %}
<style>
    body {
        background-color: #fde8e8;
        color: #243447;
    }

    .container {
        background-color: #fffdf7;
        min-height: 100vh;
        padding-bottom: 2rem;
    }

    h3 {
        color: #b21f2d;
        font-weight: 700;
        margin-top: 1rem;
        margin-bottom: 1.5rem;
        text-transform: capitalize;
    }

    li {
        color: #243447;
    }

    .list-group-item {
        background-color: #ffffff;
    }

    .trainer-header {
        background: linear-gradient(135deg, #b21f2d 0%, #d62828 100%);
        color: #ffffff;
        padding: 2rem;
        border-radius: 15px;
        margin-bottom: 2rem;
        box-shadow: 0 8px 25px rgba(178, 31, 45, 0.3);
        text-align: center;
    }

    .trainer-header h1 {
        font-size: 2.5rem;
        margin: 0;
        font-weight: 700;
        text-transform: capitalize;
    }

    .trainer-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: start;
    }

    @media (max-width: 768px) {
        .trainer-content {
            grid-template-columns: 1fr;
        }
    }

    .trainer-image-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 400px;
    }

    .trainer-image-container img {
        max-width: 100%;
        height: auto;
        max-height: 400px;
        border-radius: 15px;
        border: 5px solid #b21f2d;
        box-shadow: 0 15px 40px rgba(178, 31, 45, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        object-fit: contain;
    }

    .trainer-image-container img:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 50px rgba(178, 31, 45, 0.5);
    }

    .trainer-details {
        background: linear-gradient(135deg, #ffffff 0%, #f9f6f0 100%);
        border: 3px solid #b21f2d;
        border-radius: 20px;
        padding: 2.5rem;
        box-shadow: 0 8px 25px rgba(178, 31, 45, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.8);
        position: relative;
        overflow: hidden;
    }

    .trainer-details::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #b21f2d, #d62828, #b21f2d);
        border-radius: 20px 20px 0 0;
    }

    .trainer-details h3 {
        margin-top: 0;
        padding-top: 0.5rem;
    }

    .detail-item {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        padding: 1.2rem 0;
        border-bottom: 2px solid #d62828;
        transition: background 0.3s ease;
    }

    .detail-item:hover {
        background: rgba(178, 31, 45, 0.05);
        padding-left: 1rem;
        padding-right: 1rem;
        margin: 0 -1rem;
        border-radius: 8px;
    }

    .detail-item:last-child {
        border-bottom: none;
    }

    .detail-label {
        font-weight: 700;
        color: #b21f2d;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
    }

    .detail-value {
        color: #243447;
        font-size: 1.1rem;
        font-weight: 600;
        background: linear-gradient(135deg, rgba(178, 31, 45, 0.08), rgba(214, 40, 40, 0.08));
        padding: 0.7rem 1.5rem;
        border-radius: 12px;
        border: 2px solid rgba(178, 31, 45, 0.15);
        box-shadow: 0 2px 8px rgba(178, 31, 45, 0.1);
        text-align: center;
    }
</style>

<div class="trainer-header">
    <h1>👤 {{ trainer | capfirst }}</h1>
</div>

<div class="trainer-content">
    {% if trainer.image %}
    <div class="trainer-image-container">
        <img src="{{ trainer.image.url }}" alt="{{ trainer }}">
    </div>
    {% endif %}
    
    <div>
        <h3>📋 Detalles:</h3>
        <div class="trainer-details">
            <div class="detail-item">
                <span class="detail-label">⭐ Nivel:</span>
                <span class="detail-value">{{trainer.level}}</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">🎂 Fecha de Nacimiento:</span>
                <span class="detail-value">{{trainer.birth_date}}</span>
            </div>
        </div>
    </div>
</div>
   
{% endblock content %}
