{% extends "base.html" %}
{% block title %}{{ trainer | capfirst}}{% endblock title %}
{% block content %}
<style>
    body {
        background-color: #fde8e8;
        color: #243447;
    }

    .container {
        background-color: #fffdf7;
        min-height: 100vh;
        padding-bottom: 2rem;
    }

    h3 {
        color: #b21f2d;
    }

    li {
        color: #243447;
    }

    .list-group-item {
        background-color: #ffffff;
    }
</style>

            <h3>{{ trainer | capfirst }}</h3>
            
            {% if trainer.image %}
            <div class="mb-3">
                <img src="{{ trainer.image.url }}" alt="{{ trainer }}" style="max-width: 300px; height: auto; border-radius: 8px;">
            </div>
            {% endif %}
            
            <h3>Detalles:</h3>
            <br>
            <ul class="list-group-item">
                <li class="list-group-item">
                    <strong>Nivel:</strong>  {{trainer.level}} 
                </li>
                <li class="list-group-item">
                    <strong>Fecha de Nacimiento:</strong> {{trainer.birth_date}} 
                </li>
            </ul>
 {% endblock content %}
